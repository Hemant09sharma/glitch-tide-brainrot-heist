# Rojo configuration for Glitch Tide — Brainrot Heist: The Memeverse
# Build with: rojo build default.project.json --output game.rbxl
# Serve with: rojo serve

[build]
# Rojo writes the place file here when `rojo build` is run without -o.
output = "game.rbxl"

[serve]
port = 34872
# Serve the project so the Roblox Studio plugin can sync live edits.
